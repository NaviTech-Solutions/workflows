name: Update @main Tag on CI Change

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yaml

jobs:
  update-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        #uses: actions/checkout@v6.0.2
        uses: https://gitea.com/actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Force update main tag to latest commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f main ${{ github.sha }}
          git push origin refs/tags/main --force
